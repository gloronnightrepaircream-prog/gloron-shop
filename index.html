<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Review admin | GLORON BEAUTY</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/reviews.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>.wrap{max-width:860px;margin:0 auto;padding:110px 20px 60px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{margin:0;padding:9px 16px;font-size:.85rem}.tabs{display:flex;gap:8px;margin:16px 0}.tabs .btn{background:#eee4d4;color:#29221b}.tabs .on{background:#29221b;color:#fff}.red{background:#a33a2f;color:#fff}.light{background:#eee4d4;color:#29221b}.meta{color:#776e62;font-size:.85rem}</style></head>
<body><header><a class="brand" href="/">GLORON <small>BEAUTY</small></a></header><main class="wrap"><h1>Review admin</h1>
<form id="lf" class="card"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label><button class="btn dark">Sign in</button> <small id="lm" aria-live="polite"></small></form>
<section id="panel" hidden><div class="row"><span class="meta" id="who"></span><button class="btn light" id="out">Sign out</button></div><div class="tabs"><button class="btn on" data-t="pending">Waiting</button><button class="btn" data-t="approved">Published</button></div><div id="list"></div></section></main>
<script>
const U='https://leqwgyjliyifxebickzs.supabase.co',sb=window.supabase.createClient(U,'sb_publishable_DbW1WivxOhEfo7yValBJmg_4JjzCtOC');
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
let rows=[],tab='pending';
function draw(){const L=rows.filter(r=>r.status===tab);$('list').innerHTML=L.length?L.map(r=>`<article class="review" data-id="${esc(r.id)}"><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><b>${esc(r.name)}</b> <span class="meta">${new Date(r.created_at).toLocaleString('en-IN')}${r.order_ref?' · Order: '+esc(r.order_ref):''}${r.verified?' · ✓ Verified':''}</span><p>${esc(r.review_text)}</p>${r.photo_url?`<a href="${esc(r.photo_url)}" target="_blank" rel="noopener"><img class="rphoto" src="${esc(r.photo_url)}" alt="Review photo"></a>`:''}<div class="row">${r.status==='pending'?'<button class="btn gold" data-a="approve">Approve</button>':'<button class="btn light" data-a="unpublish">Unpublish</button>'}<button class="btn light" data-a="verify">${r.verified?'Remove verified':'Mark verified'}</button><button class="btn red" data-a="delete">Delete</button></div></article>`).join(''):'<p class="meta">Nothing here.</p>'}
async function load(){const {data,error}=await sb.from('reviews').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<p>Could not load reviews: '+esc(error.message)+'</p>';return}rows=data;
if(!rows.length&&!(await sb.rpc('is_review_admin')).data)$('list').innerHTML='<p>You are signed in but not set up as an admin. Run the SQL file first.</p>';else draw()}
async function show(s){const on=!!s;$('lf').hidden=on;$('panel').hidden=!on;if(on){$('who').textContent='Signed in as '+s.user.email;load()}}
$('lf').onsubmit=async e=>{e.preventDefault();$('lm').textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(error){$('lm').textContent='Sign in failed. Check your email and password.';return}$('lm').textContent='';show(data.session)};
$('out').onclick=async()=>{await sb.auth.signOut();show(null)};
document.querySelector('.tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;document.querySelectorAll('.tabs .btn').forEach(b=>b.classList.toggle('on',b.dataset.t===t));draw()};
$('list').onclick=async e=>{const a=e.target.dataset.a;if(!a)return;const id=e.target.closest('.review').dataset.id,r=rows.find(x=>String(x.id)===id);let q;
if(a==='approve')q=sb.from('reviews').update({status:'approved'}).eq('id',r.id);
if(a==='unpublish')q=sb.from('reviews').update({status:'pending'}).eq('id',r.id);
if(a==='verify')q=sb.from('reviews').update({verified:!r.verified}).eq('id',r.id);
if(a==='delete'){if(!confirm('Delete this review permanently?'))return;if(r.photo_url&&r.photo_url.startsWith(U+'/storage/'))await sb.storage.from('review-photos').remove([r.photo_url.split('/review-photos/')[1]]);q=sb.from('reviews').delete().eq('id',r.id)}
const {error}=await q;if(error){alert('Failed: '+error.message);return}load()};
sb.auth.getSession().then(({data})=>show(data.session));
</script></body></html>
